[package]
name = "nicemail"
version = "0.1.0"
description = "Nicemail — WinUI 风格第三方邮件客户端(Tauri 2)"
authors = ["Nicemail"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "nicemail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
# Tauri / 日志
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# 本地存储
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"

# 邮件引擎(同步栈)
imap = "2"
native-tls = "0.2"
lettre = { version = "0.11", features = ["smtp-transport", "builder", "native-tls"] }
mail-parser = "0.10"

# OAuth2(Google / Microsoft)
ureq = "3"
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tiny_http = "0.12"

# 工具
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tokio = { version = "1", features = ["time"] }

[profile.release]
# panic=abort 会让 imap crate 的任何断言 panic 直接杀死整个进程(闪退)。
# 改为 unwind 后,tokio spawn_blocking 会把 panic 转成命令错误返回给前端,应用不崩溃。
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
